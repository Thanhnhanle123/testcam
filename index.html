<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Camera Realtime P2P Fix</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 500px; text-align: center; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .id-box { font-size: 18px; color: #ffca28; background: #2a2a2a; padding: 8px; border-radius: 5px; word-break: break-all; margin-top: 5px; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; margin-bottom: 10px; text-align: center; }
        button { width: 100%; padding: 12px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 8px; }
        .btn-green { background: #2e7d32; color: #fff; }
        .btn-blue { background: #1565c0; color: #fff; }
        .btn-orange { background: #e65100; color: #fff; display: none; }
        .status { font-size: 13px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Camera Realtime P2P</h2>

    <div class="card">
        <div>ID Thiết bị của bạn:</div>
        <div id="my-id" class="id-box">Đang kết nối Server...</div>
    </div>

    <div class="video-box">
        <video id="video-player" autoplay playsinline muted></video>
    </div>

    <button id="play-manual-btn" class="btn-orange">▶ Bấm vào đây để phát Video</button>

    <div class="card">
        <button id="start-cam-btn" class="btn-green">1. Bật Camera (Máy Phát)</button>
        <p id="cam-status" class="status">Trạng thái: Chưa bật camera</p>
        
        <hr style="margin: 15px 0; border-color: #333;">

        <input type="text" id="remote-id-input" placeholder="Nhập ID máy phát">
        <button id="connect-btn" class="btn-blue">2. Kết Nối & Xem (Máy Xem)</button>
    </div>
</div>

<script>
    // Cấu hình danh sách STUN + TURN server hỗ trợ đâm thủng Wi-Fi/Tường lửa
    const peer = new Peer({
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:openrelay.metered.ca:80' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        }
    });

    let localStream = null;
    const myIdEl = document.getElementById('my-id');
    const videoPlayer = document.getElementById('video-player');
    const camStatus = document.getElementById('cam-status');
    const playBtn = document.getElementById('play-manual-btn');

    peer.on('open', (id) => {
        myIdEl.innerText = id;
    });

    peer.on('error', (err) => {
        alert("Lỗi kết nối WebRTC: " + err.type);
    });

    // Hàm hỗ trợ tự động phát video có kiểm tra chặn trình duyệt
    function playStream(stream) {
        videoPlayer.srcObject = stream;
        videoPlayer.play().then(() => {
            playBtn.style.display = 'none';
        }).catch(() => {
            // Nếu trình duyệt chặn tự động phát, hiện nút bắt buộc tương tác
            playBtn.style.display = 'block';
        });
    }

    playBtn.addEventListener('click', () => {
        videoPlayer.play();
        playBtn.style.display = 'none';
    });

    // 1. Máy PHÁT: Bật Camera
    document.getElementById('start-cam-btn').addEventListener('click', async () => {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });
            playStream(localStream);
            camStatus.innerText = "Camera đã Bật! Đang sẵn sàng phát.";
            camStatus.style.color = "#00e676";
        } catch (err) {
            alert("Lỗi bật camera: " + err.message);
        }
    });

    // 2. Máy XEM: Yêu cầu kết nối
    document.getElementById('connect-btn').addEventListener('click', () => {
        const remotePeerId = document.getElementById('remote-id-input').value.trim();
        if (!remotePeerId) return alert("Chưa nhập ID!");

        camStatus.innerText = "Đang thử kết nối tới Máy Phát...";
        const call = peer.call(remotePeerId, null);

        call.on('stream', (remoteStream) => {
            camStatus.innerText = "Đã nhận được hình ảnh!";
            camStatus.style.color = "#00e676";
            playStream(remoteStream);
        });
    });

    // 3. Máy PHÁT: Nhận yêu cầu và gửi luồng Video đi
    peer.on('call', (call) => {
        if (localStream) {
            call.answer(localStream);
        } else {
            alert("Máy xem đang gọi nhưng bạn chưa nhấn nút '1. Bật Camera'!");
        }
    });
</script>

</body>
</html>
