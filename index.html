<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Camera Realtime P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            margin-bottom: 15px;
            color: #00e676;
        }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .id-box {
            font-size: 18px;
            font-weight: bold;
            color: #ffca28;
            word-break: break-all;
            margin-top: 5px;
            padding: 8px;
            background: #2a2a2a;
            border-radius: 6px;
        }
        .video-container {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            margin-bottom: 10px;
            outline: none;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 8px;
        }
        .btn-start { background-color: #2e7d32; color: white; }
        .btn-start:hover { background-color: #1b5e20; }
        .btn-connect { background-color: #1565c0; color: white; }
        .btn-connect:hover { background-color: #0d47a1; }
        .status {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Camera Realtime P2P</h2>

    <div class="card">
        <div>ID Thiết bị của bạn:</div>
        <div id="my-id" class="id-box">Đang tạo ID...</div>
    </div>

    <div class="video-container">
        <video id="video-player" autoplay playsinline muted></video>
    </div>

    <div class="card">
        <button id="start-cam-btn" class="btn-start">1. Bật Camera (Máy Phát)</button>
        <p id="cam-status" class="status">Chưa bật camera</p>
        
        <hr style="margin: 15px 0; border-color: #333;">

        <input type="text" id="remote-id-input" placeholder="Nhập ID máy phát vào đây">
        <button id="connect-btn" class="btn-connect">2. Kết Nối & Xem (Máy Xem)</button>
    </div>
</div>

<script>
    // Cấu hình PeerJS kết hợp STUN Server của Google để vượt qua tường lửa/NAT
    const peer = new Peer({
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        }
    });

    let localStream = null;
    const myIdEl = document.getElementById('my-id');
    const videoPlayer = document.getElementById('video-player');
    const camStatus = document.getElementById('cam-status');

    // Lấy ID thiết bị sau khi kết nối tới Server Signaling
    peer.on('open', (id) => {
        myIdEl.innerText = id;
    });

    peer.on('error', (err) => {
        console.error("Lỗi PeerJS:", err);
        alert("Lỗi kết nối: " + err.type);
    });

    // 1. CHỨC NĂNG BẬT CAMERA (Dành cho Máy PHÁT)
    document.getElementById('start-cam-btn').addEventListener('click', async () => {
        try {
            // Lấy luồng camera (ưu tiên camera sau của điện thoại)
            localStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });

            videoPlayer.srcObject = localStream;
            videoPlayer.play();
            
            camStatus.innerText = "Camera đang hoạt động! Hãy gửi ID cho máy khác.";
            camStatus.style.color = "#00e676";
        } catch (err) {
            console.error("Lỗi Camera:", err);
            alert("Không thể bật Camera: " + err.message);
        }
    });

    // 2. CHỨC NĂNG KẾT NỐI XEM (Dành cho Máy XEM)
    document.getElementById('connect-btn').addEventListener('click', () => {
        const remotePeerId = document.getElementById('remote-id-input').value.trim();
        
        if (!remotePeerId) {
            alert("Vui lòng nhập ID của thiết bị phát!");
            return;
        }

        // Gọi kết nối tới máy phát
        const call = peer.call(remotePeerId, null);

        call.on('stream', (remoteStream) => {
            // Nhận luồng video từ máy phát và phát lên màn hình
            videoPlayer.srcObject = remoteStream;
            videoPlayer.play().catch(e => console.log("Lỗi autoplay:", e));
        });

        call.on('error', (err) => {
            alert("Lỗi cuộc gọi: " + err);
        });
    });

    // 3. LẮNG NGHE YÊU CẦU KẾT NỐI ĐẾN (Máy PHÁT tự động trả lời khi Máy XEM gọi)
    peer.on('call', (call) => {
        if (localStream) {
            // Trả lời cuộc gọi và truyền luồng video localStream đi
            call.answer(localStream);
        } else {
            alert("Có thiết bị khác đang muốn kết nối nhưng bạn CHƯA BẤM BẬT CAMERA!");
        }
    });
</script>

</body>
</html>
