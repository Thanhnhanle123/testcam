<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Camera Realtime 2 Thiết Bị</title>
    <!-- Nhúng thư viện PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 640px;
            text-align: center;
        }
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video { width: 100%; display: block; }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            width: 60%;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .btn-green { background: #28a745; color: #fff; }
        .btn-blue { background: #007bff; color: #fff; }
        .id-display {
            font-size: 18px;
            color: #ffc107;
            font-weight: bold;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Web Camera Realtime P2P</h2>

    <!-- Phần hiển thị trạng thái ID -->
    <div class="card">
        <p>ID thiết bị của bạn:</p>
        <p id="my-id" class="id-display">Đang tạo ID...</p>
    </div>

    <!-- Màn hình hiển thị Video -->
    <div class="video-box">
        <video id="remote-video" autoplay playsinline controls></video>
    </div>

    <!-- Các nút điều khiển -->
    <div class="card">
        <h3>1. Nếu đây là máy PHÁT CAMERA:</h3>
        <button id="start-cam-btn" class="btn-green">Bật Camera</button>
        
        <hr style="margin: 15px 0; border-color: #333;">

        <h3>2. Nếu đây là máy XEM:</h3>
        <input type="text" id="peer-id-input" placeholder="Nhập ID máy phát vào đây">
        <button id="connect-btn" class="btn-blue">Kết nối & Xem</button>
    </div>
</div>

<script>
    // Khởi tạo PeerJS kết nối tới Server miễn phí của PeerJS
    const peer = new Peer();
    
    let localStream = null;
    const myIdEl = document.getElementById('my-id');
    const remoteVideo = document.getElementById('remote-video');

    // Lấy ID khi kết nối thành công tới Server signaling
    peer.on('open', (id) => {
        myIdEl.innerText = id;
    });

    // BẬT CAMERA (Dành cho máy Phát)
    document.getElementById('start-cam-btn').addEventListener('click', async () => {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, // Ưu tiên camera sau trên điện thoại
                audio: true 
            });
            remoteVideo.srcObject = localStream;
            alert("Đã bật Camera thành công! Hãy gửi ID của bạn cho máy XEM.");
        } catch (err) {
            alert("Lỗi mở Camera: " + err.message);
        }
    });

    // KẾT NỐI ĐẾN MÁY PHÁT (Dành cho máy Xem)
    document.getElementById('connect-btn').addEventListener('click', () => {
        const remotePeerId = document.getElementById('peer-id-input').value.trim();
        if (!remotePeerId) {
            alert("Vui lòng nhập ID của máy phát!");
            return;
        }

        // Gọi dữ liệu từ máy phát
        const call = peer.call(remotePeerId, null);
        
        call.on('stream', (remoteStream) => {
            // Nhận luồng video từ máy phát và hiển thị
            remoteVideo.srcObject = remoteStream;
        });

        call.on('error', (err) => {
            alert("Lỗi kết nối: " + err);
        });
    });

    // LÍNH CẢNH BÁO MÁY PHÁT: Tự động trả lời khi có máy khác gọi đến
    peer.on('call', (call) => {
        if (localStream) {
            call.answer(localStream); // Gửi luồng camera đi
            call.on('stream', (remoteStream) => {
                remoteVideo.srcObject = remoteStream;
            });
        } else {
            alert("Có thiết bị muốn kết nối nhưng bạn chưa Bật Camera!");
        }
    });
</script>

</body>
</html>
